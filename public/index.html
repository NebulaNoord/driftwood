<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Driftwood</title><meta name="description" content="Build an island colony, raise an army and raid other players’ islands. No account needed."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%B5%3C/text%3E%3C/svg%3E"><script>// Driftwood on the open web: stands in for window.claude.use('db' | 'user') with a tiny API (/api/db).
// Each browser gets a secret player key; the server derives the player id from it, so nobody needs an account.
(function () {
  const KEY = 'driftwood.playerKey';
  const mem = {};
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } } };
  const valid = k => typeof k === 'string' && /^dw1-[0-9a-f]{48}$/.test(k);
  let key = ls.get(KEY);
  if (!valid(key)) {
    const b = new Uint8Array(24); crypto.getRandomValues(b);
    key = 'dw1-' + [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    ls.set(KEY, key);
  }
  let idP = null;
  async function call(body) {
    const r = await fetch('/api/db', { method: 'POST', headers: { 'content-type': 'application/json', 'x-player-key': key }, body: JSON.stringify(body) });
    let out = null; try { out = await r.json(); } catch (e) {}
    if (!r.ok) { const e = new Error((out && out.error) || 'Request failed'); e.code = (out && out.code) || (r.status === 403 ? 'permission_denied' : r.status === 429 ? 'resource_exhausted' : 'unavailable'); throw e; }
    return out;
  }
  const myId = () => idP || (idP = call({ op: 'me' }).then(r => r.id).catch(e => { idP = null; throw e; }));
  const segs = p => String(p).split('/').length;
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapDoc = (id, exists, data) => ({ id, exists, data: () => data, metadata: meta });
  const jsonClone = v => JSON.parse(JSON.stringify(v));
  // polling stands in for live updates; it slows down while the tab is hidden
  function poll(fn, ms) {
    let dead = false, timer = 0;
    const tick = async () => { if (dead) return; try { await fn(); } catch (e) {} if (!dead) timer = setTimeout(tick, document.hidden ? ms * 4 : ms); };
    tick();
    return () => { dead = true; clearTimeout(timer); };
  }
  function docRef(path) {
    const id = path.slice(path.lastIndexOf('/') + 1);
    const ref = {
      id, path,
      async get() { const r = await call({ op: 'get', path }); return snapDoc(id, !!r.exists, r.data); },
      async set(data) { await call({ op: 'set', path, data: jsonClone(data) }); },
      async update(data) { await call({ op: 'update', path, data: jsonClone(data) }); },
      async delete() { await call({ op: 'delete', path }); },
      onSnapshot(next, err) {
        let last = null;
        return poll(async () => { try { const s = await ref.get(); const sig = JSON.stringify([s.exists, s.data()]); if (sig !== last) { last = sig; next(s); } } catch (e) { if (err) err(e); } }, 6000);
      },
    };
    return ref;
  }
  function query(coll, filters, order, lim) {
    const run = async () => {
      const r = await call({ op: 'list', coll, limit: Math.min(lim || 200, 200), where: filters });
      let rows = r.docs || [];
      for (const [f, op, v] of filters) rows = rows.filter(d => op === '==' ? d.data[f] === v : op === '!=' ? d.data[f] !== v : op === '>' ? d.data[f] > v : op === '>=' ? d.data[f] >= v : op === '<' ? d.data[f] < v : op === '<=' ? d.data[f] <= v : true);
      if (order) rows.sort((a, b) => (a.data[order[0]] > b.data[order[0]] ? 1 : a.data[order[0]] < b.data[order[0]] ? -1 : 0) * (order[1] === 'desc' ? -1 : 1));
      if (lim) rows = rows.slice(0, lim);
      const docs = rows.map(d => snapDoc(d.id, true, d.data));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta };
    };
    return {
      where: (f, op, v) => query(coll, filters.concat([[f, op, v]]), order, lim),
      orderBy: (f, d) => query(coll, filters, [f, d || 'asc'], lim),
      limit: n => query(coll, filters, order, n),
      get: run,
      onSnapshot(next, err) {
        let last = null;
        return poll(async () => { try { const s = await run(); const sig = JSON.stringify(s.docs.map(d => [d.id, d.data()])); if (sig !== last) { last = sig; next(s); } } catch (e) { if (err) err(e); } }, coll === 'islands' ? 15000 : 8000);
      },
      doc: id => docRef(coll + '/' + (id || Math.random().toString(36).slice(2, 12))),
      async add(data) { const r = await call({ op: 'add', coll, data: jsonClone(data) }); return docRef(coll + '/' + r.id); },
    };
  }
  const db = {
    doc(p) { if (segs(p) % 2) throw new TypeError('document path needs an even number of segments: ' + p); return docRef(p); },
    collection(c) { if (!(segs(c) % 2)) throw new TypeError('collection path needs an odd number of segments: ' + c); return query(c, [], null, 0); },
  };
  const user = {
    id: myId,
    can: async () => true, canEdit: async () => true, isOwner: async () => false,
    me: async () => ({ id: await myId(), name: '', color: '#888', email: null }),
    async profiles(ids) { const r = await call({ op: 'profiles', ids: [].concat(ids).slice(0, 100) }); return r.profiles || {}; },
  };
  window.claude = {
    web: {
      key: () => key, valid,
      setKey(k) { if (!valid(k)) return false; ls.set(KEY, k); ls.set(KEY + '.switched', '1'); location.reload(); return true; },
      switched() { const v = ls.get(KEY + '.switched') === '1'; if (v) ls.set(KEY + '.switched', ''); return v; },
    },
    use: async name => name === 'db' ? db : name === 'user' ? user : null,
  };
})();
</script></head><body style="margin:0"><title>Driftwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: the island fills the screen; driftwood-and-paper panels float at the corners, the build dock sits at the bottom like a toybox. */
:root {
  --paper: #fbf4e6;
  --paper-2: #f3e6cc;
  --ink: #3b2f2a;
  --ink-soft: #7a6a5f;
  --coral: #e76f51;
  --sea: #2a9d8f;
  --sun: #f4c95d;
  --leaf: #6aa84f;
  --line: #e2d2b2;
  --bad: #d64545;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 6px 0 rgba(59, 47, 42, 0.14), 0 12px 28px rgba(30, 40, 60, 0.18);
  color-scheme: light;
}
html, body { height: 100%; }
body { background: #8fd0e8; color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#gl.paint { cursor: crosshair; }
#gl.grab { cursor: grabbing; }

.panel { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); border: 2px solid #fffaf0; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
@keyframes jelly { 0% { transform: scale(1); } 30% { transform: scale(1.18, 0.86); } 55% { transform: scale(0.92, 1.1); } 75% { transform: scale(1.04, 0.97); } 100% { transform: scale(1); } }
@keyframes rise { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -46px); opacity: 0; } }

/* resources */
#res { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 4px; padding: 6px 8px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 24px - 230px); }
.r { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 12px; min-width: 0; }
.r svg { flex: none; }
.r b { font-family: var(--f-display); font-weight: 800; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; padding-top: 3px; }
.r small { display: block; font-size: 10px; font-weight: 800; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; }
#res { cursor: pointer; }
.r .rate { text-transform: none; letter-spacing: 0; font-size: 11px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.up { color: #2f7d3a !important; } .down { color: var(--bad) !important; }
#stock { position: absolute; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 76px); left: max(12px, env(safe-area-inset-left, 0px)); width: 330px; max-width: calc(100% - 24px); padding: 14px 16px; animation: pop 0.25s cubic-bezier(.34,1.56,.64,1); max-height: calc(100% - 180px); overflow-y: auto; }
#stock h3 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 800; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
#stock h3 button { border: 0; background: var(--paper-2); width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-weight: 900; }
#stock table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
#stock td { padding: 5px 0 1px; font-weight: 800; }
#stock td svg { vertical-align: -4px; margin-right: 4px; }
#stock td:nth-child(2), #stock td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
#stock tr.sub td { font-weight: 600; font-size: 12px; color: var(--ink-soft); padding: 0 0 8px; border-bottom: 2px dashed var(--line); text-align: left; }
.facs { display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 700; }
.facs span { display: inline-block; min-width: 34px; font-weight: 900; }
#chat { position: absolute; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: 310px; padding: 8px 8px 6px; display: flex; flex-direction: column; gap: 4px; }
#chat .ch-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 0 6px; }
#chat .ch-head b { font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); }
#chat .ch-head button { border: 0; background: var(--paper-2); border-radius: 8px; width: 26px; height: 22px; cursor: pointer; font-size: 12px; color: var(--ink-soft); }
#chat .ch-list { display: flex; flex-direction: column; gap: 2px; max-height: 214px; overflow-y: auto; scrollbar-width: thin; }
#chat .ln { display: flex; gap: 8px; align-items: flex-start; text-align: left; border: 0; background: none; padding: 5px 6px; border-radius: 9px; cursor: pointer; font-size: 12.5px; line-height: 1.35; color: var(--ink); }
#chat .ln.new { animation: chatIn 0.35s cubic-bezier(.34,1.56,.64,1); }
#chat .ln:hover, #chat .ln.sel { background: var(--paper-2); }
#chat .ln i { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 4px; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
#chat .ln b { font-weight: 900; margin-right: 4px; }
#chat .ln em { font-style: normal; font-size: 10.5px; font-weight: 800; color: var(--ink-soft); margin-right: 4px; }
#chat .ch-empty { margin: 2px 6px 4px; font-size: 12px; color: var(--ink-soft); }
#chat.mini { flex-direction: row-reverse; align-items: center; padding: 4px 6px; }
#chat.mini .ch-head b { display: none; }
#chat.mini .ch-head { padding: 0; }
#chat.mini .ch-list { max-height: 30px; overflow: hidden; flex: 1; min-width: 0; }
#chat.mini .ln { white-space: nowrap; }
#chat.mini .ln span { overflow: hidden; text-overflow: ellipsis; }
@keyframes chatIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 1240px) and (min-width: 701px) { #chat { bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); } }
.bub { position: absolute; transform: translate(-50%, -100%); background: #fff; color: var(--ink); border-radius: 12px; padding: 5px 9px; font-size: 12px; font-weight: 800; max-width: 170px; text-align: center; line-height: 1.25; box-shadow: 0 3px 0 rgba(59,47,42,0.15), 0 4px 12px rgba(0,0,0,0.12); pointer-events: none; animation: bubIn 0.3s cubic-bezier(.34,1.56,.64,1); white-space: normal; width: max-content; }
.bub::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
@keyframes bubIn { from { transform: translate(-50%, -80%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -100%) scale(1); opacity: 1; } }
#mark { position: absolute; z-index: 3; pointer-events: none; width: 16px; height: 16px; margin: -16px 0 0 -8px; background: var(--sun); border: 2px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(0,0,0,.25); animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { margin-top: -22px; } }
.badge.bld { background: #fff2cc; color: #7a5a00; }
.who { display: flex; gap: 12px; align-items: center; padding-right: 30px; }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 22px; flex: none; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.quote { background: #fff; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 13.5px; border: 2px solid var(--line); }
.row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
#modal.meet { background: rgba(40, 60, 80, 0.18); backdrop-filter: none; align-items: end; }
#modal.meet .card { width: min(620px, 100%); margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-height: 78%; }
.mt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mt-head .sub { font-weight: 800; color: var(--ink-soft); font-size: 13px; }
.week { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.week div { background: var(--paper-2); border-radius: 12px; padding: 7px 4px; text-align: center; }
.week b { display: block; font-family: var(--f-display); font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.week span { font-size: 10.5px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; transition: transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s; }
.opt:hover { transform: translateY(-3px); border-color: var(--sea); }
.opt.wish { border-color: var(--sun); background: #fffaeb; }
.opt b { font-size: 14.5px; font-weight: 900; }
.opt span { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; line-height: 1.35; }
.opt .tr { display: flex; flex-direction: column; gap: 1px; margin-top: 3px; }
.opt em { font-style: normal; font-weight: 900; font-size: 12px; }
.r.low b { color: var(--bad); }
.r.bump b { animation: jelly 0.45s ease; display: inline-block; }
.sep { width: 2px; align-self: stretch; background: var(--line); border-radius: 1px; margin: 4px 2px; }

/* clock */
#clock { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; padding: 6px; }
.time { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 4px; }
.time b { font-family: var(--f-display); font-weight: 800; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; padding-top: 3px; display: block; }
.time small { font-size: 10px; font-weight: 800; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; display: block; }
.speeds { display: flex; background: var(--paper-2); border-radius: 12px; padding: 3px; }
.speeds button { border: 0; background: none; width: 34px; height: 30px; border-radius: 9px; cursor: pointer; display: grid; place-items: center; color: var(--ink-soft); }
.speeds button.on { background: var(--ink); color: var(--paper); }
.round { border: 0; background: var(--paper-2); width: 36px; height: 36px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; transition: transform 0.15s; }
.round:hover { transform: translateY(-2px); }
.round:active { transform: scale(0.92); }

/* goals */
#goals { position: absolute; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 78px); left: max(12px, env(safe-area-inset-left, 0px)); width: 270px; padding: 12px 14px; }
#goals h3 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; }
#goals h3 button { border: 0; background: none; cursor: pointer; color: var(--ink-soft); font-size: 13px; font-weight: 800; padding: 0; }
.goal { padding: 8px 0; border-top: 2px dashed var(--line); }
.goal:first-of-type { border-top: 0; padding-top: 0; }
.goal b { display: block; font-size: 14px; font-weight: 900; }
.goal p { margin: 2px 0 6px; font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); }
.bar { height: 8px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sea), #57c4b5); border-radius: 4px; transition: width 0.4s; }
.reward { font-size: 11.5px; font-weight: 800; color: var(--coral); margin-top: 5px; }
#goals.min .goal, #goals.min .more { display: none; }
.more { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

/* dock */
#dock { position: absolute; z-index: 6; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none; }
#dock::-webkit-scrollbar { display: none; }
.cat { border: 0; background: none; border-radius: 13px; width: 66px; height: 62px; flex: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), background 0.15s; }
.cat span { font-size: 11px; font-weight: 900; }
.cat:hover { background: var(--paper-2); transform: translateY(-3px); }
.cat:active { transform: scale(0.9); }
.cat.on { background: var(--ink); color: var(--paper); }
.cat .k { position: absolute; }
#tray { position: absolute; z-index: 6; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); padding: 10px; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 24px); animation: pop 0.28s cubic-bezier(.34,1.56,.64,1); }
.items { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.item { flex: none; width: 112px; border: 2px solid transparent; background: var(--paper-2); border-radius: 14px; padding: 6px 6px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; transition: transform 0.18s cubic-bezier(.34,1.56,.64,1); position: relative; }
.item:hover { transform: translateY(-4px) rotate(-1deg); }
.item:active { transform: scale(0.94); }
.item.on { border-color: var(--ink); background: #fff7e6; }
.item.locked { opacity: 0.55; }
.item img, .item .ico { width: 72px; height: 60px; object-fit: contain; display: grid; place-items: center; }
.item b { font-size: 12.5px; font-weight: 900; line-height: 1.15; }
.costs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.cost { font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 2px; }
.cost.no { color: var(--bad); }
.lock { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 900; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 1px 5px; }
.size { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; color: var(--ink-soft); padding: 0 4px; }
.size input { flex: 1; accent-color: var(--sea); }
.size output { min-width: 18px; color: var(--ink); }

/* inspector */
#insp { position: absolute; z-index: 5; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 72px); width: 290px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 180px); overflow-y: auto; animation: pop 0.3s cubic-bezier(.34,1.56,.64,1); }
#insp h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.05; }
#insp .sub { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
#insp .x { position: absolute; top: 10px; right: 10px; border: 0; background: var(--paper-2); width: 28px; height: 28px; border-radius: 9px; cursor: pointer; font-size: 16px; font-weight: 900; }
.status { border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 800; line-height: 1.35; }
.status.ok { background: #e3f3df; color: #2f6b2a; }
.status.warn { background: #fde9cf; color: #8a4b0f; }

}

function tick(S, dt) {
  const p = pop(S);
  let rebuilt = false;
  for (const b of S.b) {
    if (!done(b)) {
      b.build = Math.min(1, b.build + dt / (TYPES[b.type].build || 1) * (wxKind(S) === 'storm' ? 0.5 : wxKind(S) === 'rain' ? 0.8 : 1));
      b.status = 'building';
      if (b.build >= 1) { b.status = ''; rebuilt = true; ev(S, { type: 'built', id: b.id }); }
      continue;
    }
    const T = TYPES[b.type];
    if (!T.jobs) continue;
    if (b.burnt) { b.status = 'burnt'; continue; }
    if (!b.conn) b.status = 'noroad';
    else if (b.staff === 0) b.status = 'nostaff';
    else if (b.status !== 'notrees') b.status = '';
    if (b.type === 'bakery' && b.staff && !S.b.some(x => x.type === 'farm' && x.staff > 0 && done(x))) b.status = 'nofarm';
    if (b.type === 'sawmill' && b.staff && !S.b.some(x => x.type === 'lumber' && done(x) && bDist(x, b) <= TYPES.sawmill.radius)) b.status = 'nolumber';
    const pr = prodOf(S, b);
    if (!pr) continue;
    const amt = pr.rate * dt;
    S[pr.res] += amt; S.stats[pr.res] += amt;
    b.shown = (b.shown || 0) + amt;
    if (!amt) continue;
    const chunk = pr.res === 'food' ? 5 : pr.res === 'gold' ? 10 : 4;
    if (b.shown >= chunk) { b.shown -= chunk; ev(S, { type: 'gain', id: b.id, res: pr.res, n: chunk }); }
    if (b.type === 'farm' || b.type === 'orchard') {
      b.prog += dt / 12 * (b.staff / T.jobs);
      if (b.prog >= 1) { b.prog = 0; ev(S, { type: 'harvest', id: b.id }); }
    } else if (b.type === 'lumber') {
      // every 5 wood fells one grown tree and plants a sapling, so the forest keeps going
      b.prog += amt;

function weekSnap(S) { return { t: S.t, pop: pop(S), food: S.stats.food, wood: S.stats.wood, stone: S.stats.stone, gold: S.stats.gold, arrivals: S.stats.arrivals || 0, happy: S.happy, built: S.b.length }; }

const DAILY = [
  { id: 'whale', text: 'Whales were spotted off the coast! Everyone is talking about it.', fx: { kind: 'happy', amt: 4, h: 20 } },
  { id: 'driftwood', text: 'A storm washed driftwood ashore. +30 wood.', give: { wood: 30 } },
  { id: 'minstrel', text: 'A travelling minstrel is playing in the square today.', fx: { kind: 'happy', amt: 5, h: 16 } },
  { id: 'bumper', text: 'Bumper crop! Farms and orchards yield 50% more today.', fx: { kind: 'prod', res: 'food', mult: 1.5, h: 20 }, need: S => S.b.some(b => (b.type === 'farm' || b.type === 'orchard') && done(b)) },
  { id: 'shoal', text: 'A great shoal of fish in the bay. Docks catch double today.', fx: { kind: 'prod', res: 'dock', mult: 2, h: 14 }, need: S => S.b.some(b => b.type === 'dock' && done(b)) },

function hourly(S) {

  const wasK = S.wx.now.k; wxFill(S);
  const nowK = S.wx.now.k;
  if (nowK !== wasK && hr >= 6 && hr <= 21) {
    const line = { storm: 'A storm is rolling in. Fishing stops and building slows until it passes.', rain: 'Rain’s setting in. Good for the crops, bad for fishing.',
      fog: 'Fog has settled over the island.', drizzle: 'A light drizzle. The farms won’t complain.' }[nowK];
    if (line) say(S, line, nowK === 'storm' ? 'bad' : 'info');
    if ((nowK === 'clear' || nowK === 'fair') && (wasK === 'storm' || wasK === 'rain')) say(S, 'The rain has cleared.', 'info');
  }
  // tree growth & spread
  let grew = false;
  for (let c = 0; c < N * N; c++) {
    if (!S.tree[c]) continue;
    if (S.treeG[c] < 255) { S.treeG[c] = Math.min(255, S.treeG[c] + 8); grew = true; }
  }
  for (let a = 0; a < 14; a++) {
    const c = Math.floor(rnd(S) * N * N);
    if (!S.tree[c] || S.treeG[c] < 255) continue;
    const i = c % N + Math.floor(rnd(S) * 3) - 1, j = ((c / N) | 0) + Math.floor(rnd(S) * 3) - 1;
    if (!inB(i, j)) continue;
    const k = ci(i, j), kind = cellKind(S, i, j);
    if (S.tree[k] || S.occ[k] || S.road[k] || (kind !== 2 && kind !== 3) || rnd(S) > 0.35) continue;
    S.tree[k] = S.tree[c]; S.treeG[k] = 10; ev(S, { type: 'sprout', c: k });
  }
  if (grew) S._dirty.trees = true;
  S.fx = (S.fx || []).filter(f => f.until > S.t);
  staff(S); coverage(S); settleMood(S);
  const p = pop(S), R = rates(S);
  // morning: weather and the odd surprise
  if (hr === 5) {
    if (dayOf(S) > 0 && rnd(S) < 0.35) {
      const pool = DAILY.filter(e => !e.need || e.need(S));
      const e = pool[Math.floor(rnd(S) * pool.length)];
      if (e.fx) S.fx.push(Object.assign({}, e.fx, { until: S.t + e.fx.h, label: e.id }));
      if (e.give) spend(S, e.give, -1);
      say(S, e.text, e.fx && e.fx.amt < 0 ? 'bad' : 'good');
      ev(S, { type: 'daily', id: e.id });
    }
  }
  // settlers sail in when there are free beds and enough food
  if (!S.pending && hr >= 7 && hr <= 17 && !S.meeting) {
    const free = capacity(S, true) - p;
    const foodOk = S.food > p * 0.5 && (R.food.net >= 0 || S.food >= p * EAT * 48);
    const ships = S.fx.some(f => f.kind === 'ships' && f.until > S.t);
    if (free > 0 && !pierOk(S)) warnOnce(S, 'pier', 'A settler ship can’t land. Connect the Landing Pier to the Colony Hall by road.');
    else if (free > 0 && !foodOk) warnOnce(S, 'food', 'Settlers won’t come until you make more food than the colony eats. Build a farm, orchard or fishing dock.');
    else if (free > 0 && S.happy >= 40 && rnd(S) < (ships ? 0.8 : S.b.some(b => b.type === 'pier' && b.level >= 1) ? 0.6 : 0.45)) {
      const harbour = S.b.some(b => b.type === 'pier' && b.level >= 1);
      const n = Math.min(free, Math.round((2 + Math.floor(rnd(S) * (ships ? 6 : 4))) * (harbour ? 1.6 : 1)));

const feastCost = S => Math.max(20, Math.round(Math.min(S.food * 0.3, 80)));

function arrive(S) {
  let n = S.pending.n; const homes = [];

function step(S, hours) {
  let left = hours;
  while (left > 1e-9) {
    const dt = Math.min(0.1, left);
    const before = Math.floor(S.t + 1e-9);
    tick(S, dt);
    S.t += dt; left -= dt;
    if (S.pending && S.t >= S.pending.arrive) arrive(S);
    if (Math.floor(S.t + 1e-9) > before) { S.t = Math.round(S.t * 1e6) / 1e6; hourly(S); }
  }

    const S = this.S, now = S.wx ? S.wx.now : { k: Sim.wxKind(S), to: S.t + 10, wind: 0.3 }, nx = S.wx && S.wx.q[0];
    const tg = Object.assign({ cloud: 0, rain: 0, fog: 0, storm: 0 }, WXLOOK[now.k] || {}, { wind: now.wind });
    if (nx && now.to - S.t < 0.75) { const u = 1 - (now.to - S.t) / 0.75, L = Object.assign({ cloud: 0, rain: 0, fog: 0, storm: 0 }, WXLOOK[nx.k] || {}, { wind: nx.wind }); for (const k in tg) tg[k] += (L[k] - tg[k]) * u; }

    const want = Math.round(Math.min(900, 620 * v.rain));

    while (this.rain.length < want) this.rain.push({ x: fx + (Math.random() - 0.5) * 40, z: fz + (Math.random() - 0.5) * 40, y: Math.random() * 14 });

        if (Math.random() < 0.08 && d.y > 0.02) this.addPart({ x: d.x, y: d.y + 0.02, z: d.z, vx: 0, vy: 0.5, vz: 0, life: 0, max: 0.18, size: 0.03, col: [0.8, 0.86, 0.95], g: 6, drag: 0 });
        d.y = 12 + Math.random() * 3; d.x = fx + (Math.random() - 0.5) * 40 - sx * 0.8; d.z = fz + (Math.random() - 0.5) * 40 - sz * 0.8;
      }
    }
  }

  /* --- boats --- */
  updateBoats() {
    const S = this.S, hour = S.t % 24, day = Math.floor(S.t / 24);
    // fishing boats are derived from the docks each frame
    this.fishing = [];
    for (const b of S.b) {
      if (b.type !== 'dock') continue;
      const [cx, cz] = Sim.center(b), d = Sim.DIRS[b.rot];
      const moor = [cx + d[0] * 1.6 + d[1] * 0.45, cz + d[1] * 1.6 - d[0] * 0.45];
      let pose = [moor[0], moor[1], Math.atan2(d[1], -d[0])];
      if (b.staff > 0) {
        let spot = this.fishSpots[b.id];
        if (!spot) {
          const fi = Math.floor(moor[0] + N / 2), fj = Math.floor(moor[1] + N / 2);
          const start = this.nearestWater(fi, fj, 0.25);
          let route = null;
          if (start >= 0) {
            const full = this.waterRoute(start, true);
            if (full) route = full.slice(0, Math.min(full.length - 1, 6));
          }
          spot = this.fishSpots[b.id] = route && route.length > 1 ? [[moor[0], moor[1]], ...route] : null;
        }
        if (spot) {
          let u = -1;
          if (hour >= 6 && hour < 7.5) u = (hour - 6) / 1.5;
          else if (hour >= 7.5 && hour < 14) u = 1;
          else if (hour >= 14 && hour < 15.5) u = 1 - (hour - 14) / 1.5;
          if (u >= 0) {
            const p = this.pathAt(spot, u);
            pose = [p[0], p[1], hour >= 14 ? p[2] + Math.PI : p[2]];
            if (u === 1) { const w = hour * 0.8 + b.id; pose = [p[0] + Math.cos(w) * 1.2, p[1] + Math.sin(w) * 1.2, -w]; }
          }
        }
      }
      this.fishing.push(pose);
    }
    // trader
    this.trader = null;
    const port = S.b.find(b => b.type === 'port' && b.staff > 0 && b.conn);
    if (port && day % 2 === 1 && hour >= 8 && hour < 15) {
      if (!this.traderRoute || this.traderRoute.port !== port.id) {
        const [cx, cz] = Sim.center(port), d = Sim.DIRS[port.rot];
        const berth = [cx + d[0] * 2.6 + d[1] * 1.6, cz + d[1] * 2.6 - d[0] * 1.6];
        const start = this.nearestWater(Math.floor(berth[0] + N / 2), Math.floor(berth[1] + N / 2), 0.5);
        const r = start >= 0 ? this.waterRoute(start, true) : null;
        this.traderRoute = { port: port.id, pts: r ? [berth, ...r].reverse() : null };

      const pts = this.traderRoute.pts;
      if (pts) {

    // settler boats
    for (const bt of this.boatsLive.slice()) {
      if (!bt.leave) {
        const u = clamp((S.t - bt.t0) / Math.max(0.01, bt.t1 - bt.t0), 0, 1);
        const p = this.pathAt(bt.route, 1 - Math.pow(1 - u, 2));
        bt.pose = p;
        if (S.t > bt.t1 + 2) { bt.leave = S.t; bt.back = bt.route.slice().reverse(); }
      } else {
        const u = clamp((S.t - bt.leave - 0.3) / 1.4, 0, 1);
        const p = this.pathAt(bt.back, u * u);
        bt.pose = p;
        if (u >= 1) this.boatsLive.splice(this.boatsLive.indexOf(bt), 1);
      }
    }
  }

  /* --- desire paths: wear fades slowly each hour; the ground is repainted every few seconds when it has changed --- */

    const S = this.S; if (!S.wear) return;
    const hr = Math.floor(S.t);
    if (this.wearHr === undefined) this.wearHr = hr;
    if (hr !== this.wearHr) {
      const n = Math.min(48, Math.max(0, hr - this.wearHr)); this.wearHr = hr;
      if (n) { const k = Math.pow(0.975, n), w = S.wear; for (let c = 0; c < N * N; c++) if (w[c]) { const v = Math.floor(w[c] * k); if ((v < 130) !== (w[c] < 130)) this.wearGrass = true; w[c] = v; } this.wearTex = true; }
    }

    if ((this.wearTex || !this.wearUp) && this.now - (this.wearAt || 0) > 1.5) { this.wearTex = false; this.wearUp = true; this.wearAt = this.now; if (this.R.setWear) this.R.setWear(S.wear, N); }

  }

  /* --- per-frame update --- */

    if (S._dirty.terrain) { this.buildTerrain(); S._dirty.terrain = false; }
    if (S._dirty.roads) { this.buildRoads(); S._dirty.roads = false; }
    if (S._dirty.walls) { this.buildFort(); S._dirty.walls = false; }
    this.wearTick(dtH);

      const autumn = Math.random() < 0.35, col = autumn ? [0.9, 0.6 + Math.random() * 0.2, 0.2] : [0.45, 0.7, 0.3];
      this.addPart({ x, y: Sim.heightAt(S, x, z) + 0.6 + Math.random() * 0.3, z, vx: 0.2, vy: -0.22, vz: 0.05, life: 0, max: 4, size: 0.05, col, g: 0, drag: 0, leaf: true, seed: Math.random() * 6 });
    }
    for (const p of this.parts) if (p.leaf) { p.vx = Math.sin(p.life * 2.6 + p.seed) * 0.35 + 0.12; p.vz = Math.cos(p.life * 2.1 + p.seed) * 0.15; const gy = Sim.groundAt(S, p.x, p.z); if (p.y < gy + 0.02) { p.y = gy + 0.02; p.vy = 0; p.vx = p.vz = 0; } else p.vy = -0.22; }

  /* --- render --- */
  render(R, cam, extras) {

    this.wet = Math.min(1, WV.cloud * 0.6 + WV.rain * 0.5);
    const k = Math.min(1, WV.cloud * 0.9 + WV.storm * 0.3);
    if (k > 0.01) {
      const grey = scale3([0.62, 0.66, 0.7], 1 - WV.storm * 0.35);
      env.top = mix3(env.top, scale3(grey, 0.8 + (1 - env.night) * 0.2 - env.night * 0.6), k * 0.6); env.hor = mix3(env.hor, scale3(grey, 1 - env.night * 0.7), k * 0.5);

      env.shallow = mix3(env.shallow, [0.35, 0.55, 0.58], k * 0.4); env.deep = mix3(env.deep, [0.12, 0.3, 0.4], k * 0.4);

/* ---------- Background music ----------
   "Cozy Music Sampler" by Spaceyyy (aquumgifts.itch.io), CC BY 4.0. Each file is an exact number of bars, so it loops on the beat.
   Daytime rotates three tracks, nights and rainy days have their own, and everything fades under raids and town meetings. */
const Music = {
  TRACKS: { spring: 55.384615, tavern: 51.428571, brew: 55.384615, night: 53.333333, rain: 55.384615 },
  DAY: ['spring', 'tavern', 'brew'],
  bus: null, cur: null, buffers: {}, fmt: 0, want: null, mood: null, moodAt: -1e9, day: 0, level: -1, hidden: false,
  ok() { return !!(window.DW_MUSIC && Sfx.ctx); },
  async load(name) {
    if (this.buffers[name]) return this.buffers[name];
    // each track can come in more than one format (AAC first, Opus as a fallback); remember which one this browser decodes
    const list = [].concat(window.DW_MUSIC[name] || []);
    for (let i = this.fmt || 0; i < list.length; i++) {
      try {
        const src = list[i]; let bytes;
        if (src.startsWith('data:')) { const b = atob(src.slice(src.indexOf(',') + 1)); bytes = new Uint8Array(b.length); for (let k = 0; k < b.length; k++) bytes[k] = b.charCodeAt(k); bytes = bytes.buffer; }
        else { const r = await fetch(src); if (!r.ok) throw new Error('missing'); bytes = await r.arrayBuffer(); }
        const buf = await new Promise((res, rej) => { const p = Sfx.ctx.decodeAudioData(bytes, res, rej); if (p && p.catch) p.catch(rej); });
        this.fmt = i; this.buffers[name] = buf; return buf;
      } catch (e) {}
    }
    throw new Error('can’t play this track here');
  },
  pick(mood) { return mood === 'night' ? 'night' : mood === 'rain' ? 'rain' : this.DAY[this.day % this.DAY.length]; },
  async go(name, fade) {
    if (this.want === name) return;
    this.want = name;
    let buf; try { buf = await this.load(name); } catch (e) { if (this.want === name) this.want = null; return; }
    if (this.want !== name || !UI.music) return;
    const c = Sfx.ctx, now = c.currentTime, len = this.TRACKS[name];
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true; src.loopStart = 0; src.loopEnd = Math.min(buf.duration, len);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(1, now + fade);
    src.connect(g); g.connect(this.bus); src.start(now);
    const old = this.cur;
    if (old) { old.g.gain.cancelScheduledValues(now); old.g.gain.setValueAtTime(old.g.gain.value, now); old.g.gain.linearRampToValueAtTime(0, now + fade); try { old.src.stop(now + fade + 0.2); } catch (e) {} }
    this.cur = { name, src, g, start: now, len };
    // keep only the playing track decoded, phones don't have memory to spare
    for (const k in this.buffers) if (k !== name) delete this.buffers[k];
  },
  stop() { if (!this.cur) return; const c = Sfx.ctx, now = c.currentTime; this.cur.g.gain.setTargetAtTime(0, now, 0.4); try { this.cur.src.stop(now + 2); } catch (e) {} this.cur = null; this.want = null; this.mood = null; this.buffers = {}; },
  update() {
    if (!this.ok()) return;
    const c = Sfx.ctx;
    if (!this.bus) { this.bus = c.createGain(); this.bus.gain.value = 0; this.bus.connect(c.destination); }
    const duck = Online.raid ? 0.3 : Online.mode ? 0.7 : UI.meetingOpen ? 0.55 : 1;
    const level = this.hidden ? 0 : UI.music * UI.music * 1.4 * duck;
    if (Math.abs(level - this.level) > 0.001) { this.bus.gain.setTargetAtTime(level, c.currentTime, 0.5); this.level = level; }
    if (!UI.music) { this.stop(); return; }
    if (c.state !== 'running') return;
    const h = S.t % 24, mood = Online.mode ? 'day' : h < 6 || h >= 19.5 ? 'night' : S.weather === 'rain' ? 'rain' : 'day', now = c.currentTime;
    if (!this.cur && !this.want) { this.mood = mood; this.moodAt = now; this.go(this.pick(mood), 3); return; }
    if (!this.cur) return;
    // change mood at most every 30 s, so a quick game night doesn't flip the music back and forth
    if (mood !== this.mood && now - this.moodAt > 30) { this.mood = mood; this.moodAt = now; if (mood === 'day') this.day++; this.go(this.pick(mood), 5); return; }
    // daytime: after two times through, drift into the next track right on the loop
    if (this.mood === 'day' && this.cur.name === this.pick('day') && now - this.cur.start >= this.cur.len * 2 - 4) { this.day++; this.go(this.pick('day'), 4); }
  },
};
document.addEventListener('visibilitychange', () => { Music.hidden = Sfx.hidden = document.hidden; Sfx.levels(); Music.update(); });

/* ---------- Sound: three channels, each with its own volume ----------
   effects (Sfx.master): clicks, building, battles · world (Sfx.world): waves, wind, rain, birds, the colony · music (Music.bus) */
/* ---------- World ambience: everything here is synthesized, no sound files ----------
   Steady layers (surf, wind, rain, the colony's hum) fade with the camera, weather and time of day;
   one-off sounds (gulls, songbirds, crickets, hammering) are scheduled at random. */
const Amb = {
  L: null, next: {}, t: 0, swell: 0, swellV: 0, hum: 0,
  noiseBuf(secs, brown) {
    const c = Sfx.ctx, n = Math.floor(c.sampleRate * secs), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    let b = 0; for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; if (brown) { b = b * 0.985 + w * 0.015; d[i] = b * 6; } else d[i] = w * 0.5; }
    return buf;
  },
  layer(buf, type, freq, q) {
    const c = Sfx.ctx, src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 0.7;
    const g = c.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(Sfx.world); src.start(c.currentTime + Math.random() * 0.5);
    return { f, g };
  },
  init() {
    const brown = this.noiseBuf(6, true), white = this.noiseBuf(4, false);
    this.L = {
      surf: this.layer(brown, 'lowpass', 520), wash: this.layer(white, 'bandpass', 1100, 0.5),
      wind: this.layer(white, 'bandpass', 520, 0.9), rain: this.layer(white, 'highpass', 2600, 0.5),
      hum: this.layer(white, 'bandpass', 620, 1.4),
    };
    this.next = { gull: 4, bird: 2, cricket: 1, hammer: 1.5, cart: 12, foghorn: 15 };
  },
  set(l, v, k) { l.g.gain.setTargetAtTime(Math.max(0, v), Sfx.ctx.currentTime, k || 0.6); },
  update(dt) {
    if (!this.L || !Sfx.ctx || UI.world <= 0 || Sfx.hidden) return;
    this.t += dt;
    const WV = world.wxv || { rain: 0, wind: 0.3, storm: 0, fog: 0, cloud: 0 };
    const h = S.t % 24, night = h < 5.8 || h >= 19.8, dawn = h >= 5.5 && h < 10, rain = WV.rain > 0.2, cloud = WV.cloud > 0.6;
    const far = clamp((cam.dist - 14) / 70, 0, 1), near = 1 - far, pop = Sim.pop(S), town = clamp(pop / 50, 0, 1);
    // surf: a slow swell with the odd bigger wave, louder when you pull back to see the sea
    this.swellV += (Math.random() - 0.5) * dt * 0.9 - this.swell * dt * 0.35; this.swellV *= 1 - dt * 0.4; this.swell = clamp(this.swell + this.swellV * dt, -1, 1);
    const wave = 0.5 + 0.5 * Math.sin(this.t * 0.62 + Math.sin(this.t * 0.17) * 2) * 0.6 + this.swell * 0.25;
    this.set(this.L.surf, (0.09 + 0.07 * far) * (0.55 + 0.6 * wave), 0.25);
    this.set(this.L.wash, (0.012 + 0.012 * far) * Math.max(0, wave - 0.45) * 2.2, 0.15);
    // wind: picks up when zoomed out, in cloud and rain, and a little at night
    const gust = 0.6 + 0.4 * Math.sin(this.t * 0.21) * Math.sin(this.t * 0.083 + 1);
    this.set(this.L.wind, (0.008 + 0.045 * far + WV.wind * 0.07 + WV.storm * 0.04 + (night ? 0.01 : 0)) * gust, 0.8);
    this.L.wind.f.frequency.setTargetAtTime(360 + 380 * gust + WV.wind * 250, Sfx.ctx.currentTime, 1.2);
    this.set(this.L.rain, Math.min(1.4, WV.rain) * (0.045 + 0.02 * near), 1.5);
    // the colony's hum: footsteps, voices and work, from the settlers when you're close in
    this.hum += ((Math.random() - 0.5) * 3 - this.hum) * Math.min(1, dt * 2);
    const busy = night ? 0.25 : 1;
    this.set(this.L.hum, town * near * busy * (0.02 + 0.008 * this.hum), 0.3);
    // one-off sounds
    const due = k => (this.next[k] -= dt) <= 0, W = Sfx.world;
    if (due('gull')) { this.next.gull = 6 + Math.random() * 14; if (!night && !rain && Math.random() < 0.4 + 0.5 * far) this.gull(0.022 + 0.02 * far); }
    if (due('bird')) { this.next.bird = (dawn ? 2 : 5) + Math.random() * 7; if (!night && !rain && S.tree && Math.random() < 0.8) this.songbird(0.012 + 0.02 * near * (dawn ? 1.4 : 1)); }
    if (due('cricket')) { this.next.cricket = 0.35 + Math.random() * 0.9; if (night && !rain) for (let i = 0; i < 3; i++) Sfx.tone(4600 + Math.random() * 120, 4500, 0.035, 'sine', 0.018 + 0.012 * near, i * 0.06, W); }
    if (due('hammer')) {
      this.next.hammer = 1.2 + Math.random() * 2.2;
      if (!night && near > 0.15 && S.b.some(b => b.build < 1)) { const n = 2 + Math.floor(Math.random() * 3); for (let i = 0; i < n; i++) { Sfx.noise(0.03, 2400, 0.05 * near, i * 0.2, W); Sfx.tone(620, 380, 0.05, 'triangle', 0.03 * near, i * 0.2, W); } }
    }
    if (due('foghorn')) { this.next.foghorn = 22 + Math.random() * 25; if (WV.fog > 0.6) { Sfx.tone(196, 194, 2.6, 'sine', 0.035, 0, W); Sfx.tone(392, 390, 2.2, 'sine', 0.01, 0.02, W); } }
    if (due('cart')) { this.next.cart = 10 + Math.random() * 18; if (!night && town > 0.2 && near > 0.3) for (let i = 0; i < 6; i++) Sfx.noise(0.05, 500 + Math.random() * 200, 0.03 * near * town, i * 0.13, W); }
  },
  gull(v) {
    const W = Sfx.world, p = 0.9 + Math.random() * 0.25, n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) { const d = i * (0.32 + Math.random() * 0.1); Sfx.tone(1500 * p, 950 * p, 0.28, 'triangle', v, d, W); Sfx.tone(3000 * p, 1900 * p, 0.22, 'sine', v * 0.25, d + 0.01, W); }
  },
  // a crack for close strikes, then a long low roll
  thunder(delay, strength) {
    if (!Sfx.ctx || UI.world <= 0) return;
    const W = Sfx.world, s = strength || 0.7;
    if (s > 0.8) Sfx.noise(0.25, 1400, 0.12 * s, delay, W);
    Sfx.noise(2.8, 80, 0.55 * s, delay + 0.05, W); Sfx.noise(2.2, 160, 0.25 * s, delay + 0.25, W); Sfx.tone(55, 32, 2.4, 'sine', 0.2 * s, delay + 0.1, W);
  },
  songbird(v) {
    const W = Sfx.world, base = 2600 + Math.random() * 1400, n = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) { const f = base * (0.85 + Math.random() * 0.35); Sfx.tone(f, f * (Math.random() < 0.5 ? 1.25 : 0.8), 0.07 + Math.random() * 0.05, 'sine', v, i * 0.11, W); }
  },
};

const Sfx = {
  ctx: null, master: null, world: null, hidden: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0; this.master.connect(c.destination);
    this.world = c.createGain(); this.world.gain.value = 0; this.world.connect(c.destination);
    this.levels(); Amb.init();
  },
  // volume curve: sliders feel even when the gain follows the square of the slider
  levels() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, h = this.hidden;
    this.master.gain.setTargetAtTime(h ? 0 : UI.fx * UI.fx * 1.1, t, 0.08);
    this.world.gain.setTargetAtTime(h ? 0 : UI.world * UI.world * 1.4, t, 0.3);
  },
  on(dest) { return dest === this.world ? UI.world > 0 : UI.fx > 0; },
  tone(f0, f1, dur, type, vol, delay, dest) {
    const c = this.ctx; dest = dest || this._d || this.master; if (!c || !this.on(dest)) return;
    const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, freq, vol, delay, dest) {
    const c = this.ctx; dest = dest || this._d || this.master; if (!c || !this.on(dest)) return;
    const t = c.currentTime + (delay || 0), n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(dest); s.start(t);
  },
  play(k, dest) {
    if (!this.ctx) return;

const HOUR = 3600e3;
const Online = { off: 'starting', db: null, user: null, me: null, can: null, islands: [], raids: [], names: {}, mode: null, home: null, target: null, raid: null,
  pubBusy: false, pubAt: 0, pubT: -1, pending: [], mark: null, dragAt: 0, practice: null, busy: false };
const fmtAgo = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 60 * 24 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };

function islandNameOf(X) { const a = ['Gull', 'Saltmoss', 'Cinder', 'Bramble', 'Pebble', 'Hollow', 'Kelp', 'Juniper', 'Larkspur', 'Tidewell'], b = [' Isle', ' Cay', ' Island', ' Key']; return a[X.seed % a.length] + b[(X.seed >> 4) % b.length]; }

async function onlineInit() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { Online.off = 'local'; return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) { db = null; }
  if (!db || !user) { Online.off = 'nodb'; renderClock(); return; }
  Online.db = db; Online.user = user;
  try { Online.me = await user.id(); } catch (e) { Online.me = null; }
  if (!Online.me) { Online.off = C.web ? 'offline' : 'signedout'; renderClock(); return; }
  try { Online.can = await user.can('data.write'); } catch (e) { Online.can = null; }
  Online.off = null;
  if (C.web && C.web.switched && C.web.switched()) await adoptOnline();
  db.collection('islands').onSnapshot(snap => {
    Online.islands = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, data: d.data() }));
    fetchNames(Online.islands.map(x => x.id));
    if (UI.onlineOpen) renderOnline();
  }, e => { Online.err = e.code; });
  db.collection('raids').orderBy('at', 'desc').limit(120).onSnapshot(snap => {
    Online.raids = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
    fetchNames(Online.raids.flatMap(r => [r.attacker, r.target]));

// after pasting a player code on a new device: pick up that player's newest island

    const d = await Online.db.doc('islands/' + Online.me).get(), x = d.exists ? d.data() : null;
    let best = slots[0] || null;
    if (x && (x.z || x.save) && (!best || (+x.at || 0) >= best.at)) best = { where: 'shared', z: x.z || x.save, name: String(x.name || 'your island').slice(0, 40) };
    if (!best) { toast('Player code switched. No islands saved under it yet.'); return; }
    const T = Sim.deserialize(await readSlot(best));

async function fetchNames(ids) {

  for (const id of want) Online.names[id] = '';

/* --- raids against you while you were away --- */
function checkIncoming() {
  if (Online.mode || !Online.me) return;
  const m = mp(), since = m.lastRaidAt || 0;
  const fresh = Online.raids.filter(r => r.target === Online.me && typeof r.at === 'number' && r.at > since && r.at < Date.now() + 5 * 60e3 && r.attacker !== Online.me).sort((a, b) => a.at - b.at);
  if (!fresh.length) return;
  const total = { gold: 0, wood: 0, stone: 0, burnt: 0 }, from = [];
  for (const r of fresh) {
    const l = r.loot || {}, lost = Sim.applyRaid(S, { gold: safeInt(l.gold, Sim.RAID.cap.gold), wood: safeInt(l.wood, Sim.RAID.cap.wood), stone: safeInt(l.stone, Sim.RAID.cap.stone) });
    for (const k in total) total[k] += lost[k];
    total.burnt = (total.burnt || 0) + Sim.burnBuildings(S, Array.isArray(r.burnt) ? r.burnt.slice(0, 6) : []);
    from.push(r);
    m.lastRaidAt = r.at; m.shieldUntil = Math.max(m.shieldUntil || 0, r.at + Sim.RAID.shieldH * HOUR); m.lost = (m.lost || 0) + 1;
  }
  save(); publishIsland(true); renderRes();
  Online.pending.push({ total, from });
  if ($('#modal').hidden && !UI.introOpen && !UI.meetingOpen) showRaidedReport();
}

/* --- computer islands: four rivals from sleepy to fortress, rebuilt every couple of hours --- */
const RIVALS = [
  { id: 'cove', name: 'Smuggler’s Cove', stars: 1, cd: 0.5, desc: 'A sleepy fishing village with a couple of guards and no walls.', houses: 8, build: ['farm', 'market', 'lumber'], stores: [500, 250, 150] },
  { id: 'pirate', name: 'Pirate Cove', stars: 2, cd: 1, desc: 'Pirates with a garrison that grows with your army.', houses: 12, build: ['farm', 'market', 'lumber', 'tavern', 'orchard', 'barracks', 'quarry'], stores: [900, 400, 300], scale: true },
  { id: 'iron', name: 'Ironhold', stars: 3, cd: 1, desc: 'A palisaded town with watchtowers, infantry and archers.', houses: 14, build: ['farm', 'market', 'quarry', 'barracks', 'archery', 'watchtower', 'blacksmith', 'tavern'], stores: [1400, 600, 800], troops: { inf: 3, arc: 2 }, wall: 1 },
  { id: 'fort', name: 'Dragon’s Teeth', stars: 4, cd: 2, desc: 'A stone fortress with cannons, cavalry and towers. Bring a fleet.', houses: 16, build: ['farm', 'market', 'barracks', 'archery', 'cavyard', 'foundry', 'watchtower', 'watchtower', 'guardhouse', 'tavern'], stores: [2600, 900, 1100], troops: { inf: 6, arc: 4, cav: 2, can: 1 }, wall: 2 },
];
function makeRivalIsland(R) {
  const seed = ((Math.floor(Date.now() / (2 * HOUR)) * 7919) + R.stars * 104729) >>> 0;
  const T = Sim.newGame(seed);
  T.wood = T.gold = T.stone = T.food = 99999; for (const k of Sim.BUILDABLE) T.goals['unlock_' + k] = 1; T.goals.unlock_wall1 = T.goals.unlock_wall2 = 1;
  let s = seed % 2147483646 + 1; const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const conn = () => { const o = []; for (let c = 0; c < N * N; c++) if (T._conn[c]) o.push([c % N, (c / N) | 0]); return o; };
  for (let k = 0; k < 7 + R.stars * 2; k++) { const rc = conn(); for (let a = 0; a < 60; a++) { const [i, j] = rc[Math.floor(rand() * rc.length)]; const d = Sim.DIRS[Math.floor(rand() * 4)]; const cells = Sim.roadPath([i, j], [i + d[0] * 7, j + d[1] * 7]); const q = Sim.roadQuote(T, cells); if (q.n >= 5 && !q.blocked) { Sim.buildRoad(T, cells); break; } } }
  const place = t => { const rc = conn(), sz = TYPES[t].size; for (let a = 0; a < 600; a++) { const [i, j] = rc[Math.floor(rand() * rc.length)]; const o = [[1, 0], [-sz, 0], [0, 1], [0, -sz]][Math.floor(rand() * 4)]; if (Sim.place(T, t, i + o[0], j + o[1], Math.floor(rand() * 4)).building) return; } };
  for (let k = 0; k < R.houses; k++) place('house');
  const mine = landingParty().troops;
  const extra = R.scale && mine >= 4 ? ['watchtower'] : [];
  for (const t of R.build.concat(extra)) place(t);
  const wall = R.wall || (R.scale && mine >= 4 ? 1 : 0);
  if (wall) {
    const hall = T.b.find(b => b.type === 'hall'), ring = [], r = 5 + R.stars;
    for (let a = 0; a < 360; a += 2) ring.push([Math.round(hall.i + 1 + Math.cos(a * Math.PI / 180) * r), Math.round(hall.j + 1 + Math.sin(a * Math.PI / 180) * r)]);
    Sim.buildWall(T, ring, wall);
  }
  for (const b of T.b) b.build = 1;
  for (let k = 0; k < 24 * 3 * 4; k++) { Sim.step(T, 0.25); T.meeting = null; }
  const A = Sim.army(T);
  const tr = R.scale ? { inf: Math.min(6, Math.floor(mine / 3)), arc: Math.min(4, Math.floor(mine / 5)) } : (R.troops || {});
  for (const t of Sim.TROOP_KEYS) { A.n[t] = tr[t] || 0; A.atk[t] = 0; }
  [T.gold, T.wood, T.stone] = R.stores; T._ev.length = 0; T.goals = {};
  T.t = Math.floor(T.t / 24) * 24 + 10; T.weather = 'sun';
  return T;
}
function startRival(id) {
  const R = RIVALS.find(x => x.id === id); if (!R) return;
  const m = mp(); if (((m.rivalAt || {})[R.id] || 0) + R.cd * HOUR > Date.now()) { toast(`${R.name} is still rebuilding.`, 'bad'); return; }
  Online.busy = true; toast(`Charting a course to ${R.name}…`);
  setTimeout(() => {
    try { const T = makeRivalIsland(R); leaveHome(T, 'raid', { id: null, name: R.name, practice: true, rival: R.id }); startRaid(); }
    finally { Online.busy = false; }
  }, 50);
}

/* --- the raid itself --- */
// who sails: your attack team, plus a few volunteers (more volunteers if you have no army yet)
function landingParty() {
  const H = homeS(), A = Sim.army(H), army = {}; let n = 0;
  for (const t of Sim.TROOP_KEYS) { army[t] = A.atk[t]; n += A.atk[t]; }
  return { army, militia: n ? 3 : crewSize(), lv: Object.assign({}, A.lv), boat: A.boat, troops: n };
}
function startRaid() {
  const P = landingParty();
  const r = new Raid(S, world, { militia: P.militia, army: P.army, lv: P.lv, boat: P.boat, sfx: k => Sfx.play(k),
    onEnd: res => setTimeout(() => showRaidResult(res), 1400),
    onAlarm: () => toast('The bell is ringing! The defenders are coming.', 'bad'),
    onWarn: () => toast('20 seconds! Get the loot back to the ship!', 'goal') });

  setSpeed(1);
  cam.fly = [r.bank[0], r.bank[1]]; cam.gdist = cssW < 700 ? 22 : 19; cam.gpitch = 0.85;

const TROOP_ICON = { all: '⚔️', mil: '🪓', inf: '🛡️', arc: '🏹', cav: '🐎', can: '💣' };
const TROOP_LABEL = { all: 'All', mil: 'Volunteers', inf: 'Infantry', arc: 'Archers', cav: 'Cavalry', can: 'Cannons' };
function showRaidResult(res) {

  const got = { gold: Math.floor(l.gold * (half ? 0.5 : 1)), wood: Math.floor(l.wood * (half ? 0.5 : 1)), stone: Math.floor(l.stone * (half ? 0.5 : 1)) };

    <div class="week">${chips}<div><b>${res.destroyed.length}</b><span>burned</span></div><div><b>${sent - lost}/${sent}</b><span>home safe</span></div><div><b>${res.downs}</b><span>foes down</span></div></div>

// bank the loot on your own island, bury the fallen, log the raid for the defender
async function finishRaid() {
  const R0 = Online.result; Online.result = null;
  const target = Online.target;
  sailHome();
  if (!R0) return;
  const m = mp(), g = R0.got;
  S.gold += g.gold; S.wood += g.wood; S.stone += g.stone;
  Sim.loseTroops(S, R0.res.lost);
  if (g.gold + g.wood + g.stone > 0) { m.won = (m.won || 0) + 1; Sfx.play('goal'); toast(`Loot unloaded: +${g.gold} gold, +${g.wood} wood, +${g.stone} stone`, 'goal'); }
  if (target && target.rival) { m.rivalAt = Object.assign({}, m.rivalAt); m.rivalAt[target.rival] = Date.now(); }
  if (target && target.ghost && target.id) { m.ghostAt = Object.assign({}, m.ghostAt); m.ghostAt[target.id] = Date.now(); }
  save(); renderRes();
  if (target && !target.practice && !target.ghost && target.id && canShare()) {
    const r = R0.res;
    try { await Online.db.collection('raids').add({ attacker: Online.me, target: target.id, at: Date.now(), loot: r.loot, lost: Object.values(r.lost).reduce((a, n) => a + n, 0), downs: r.downs, burnt: r.destroyed.slice(0, 6), breaches: r.breaches, attackerName: myName(), targetName: target.name }); }

const SLOT_KEY = 'driftwood.slots.v2';

function cloudSlots() { return Online.db && Online.me && Online.can !== false ? Online.db.collection('data/users/' + Online.me) : null; }

    let col = h < -0.3 ? mix([143, 208, 232], [42, 110, 150], Math.min(1, (-h - 0.3) / 3)) : h < 0.05 ? [205, 185, 138] : h < 0.5 ? [236, 217, 163] : h > 8.5 ? [242, 242, 238] : h > 5.5 ? [163, 157, 147] : mix([128, 178, 90], [92, 140, 70], Math.min(1, h / 6));
    if (X.tree[c] && h > 0.05) col = [62, 110, 64];
    if (X.road[c]) col = X.road[c] === 4 ? [196, 187, 169] : X.road[c] === 3 ? [170, 164, 152] : [220, 198, 156];
    if (X.wall && X.wall[c]) col = X.wall[c] === 2 ? [110, 104, 96] : [94, 59, 40];

}
const slotOf = k => { const i = k.indexOf(':'); return (UI.slots || []).find(s => s.where === k.slice(0, i) && s.id === k.slice(i + 1)); };
async function savesAct(k, arg) {
  if (k === 'pageClose') { closeSaves(); return; }
  if (Online.busy) return;
  Online.busy = true;
  try {
    if (k === 'slotSave') {
      const name = ($('#slotName') && $('#slotName').value.trim()) || myName();
      const where = await writeSlot('save-' + Date.now().toString(36), name, S);
      toast(where ? `Saved “${name}”${where === 'cloud' ? ' to your account' : ' in this browser'}.` : 'Couldn’t save. Storage is full.', where ? '' : 'bad');
      UI.slots = await listSlots(); renderSaves(); return;
    }
    if (k === 'slotLoad' || k === 'slotDel') {
      const s = slotOf(arg); if (!s) return;
      const key = (k === 'slotLoad' ? 'load:' : 'del:') + arg;
      if (UI.confirm !== key) { UI.confirm = key; renderSaves(); return; }
      UI.confirm = null;
      if (k === 'slotDel') { await deleteSlot(s); toast('Deleted.'); UI.slots = await listSlots(); renderSaves(); return; }
      const T = s.mini ? Sim.deserialize(Sim.serialize(s.mini)) : Sim.deserialize(await readSlot(s));
      await keepCurrent();
      closeSaves(true); swapIsland(T); toast(`Loaded “${s.name}”.`); return;
    }
    if (k === 'export') {
      const data = JSON.stringify({ driftwood: 1, name: myName(), day: Math.floor(S.t / 24) + 1, pop: Sim.pop(S), save: Sim.serialize(S) });
      const file = (myName().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'island') + '-day' + (Math.floor(S.t / 24) + 1) + '.json';
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { try { const r = await dl.save({ filename: file, data }); if (r && r.status === 'saved') toast('Island exported.'); } catch (e) { if (!e || e.code !== 'cancelled') toast('Couldn’t export the file.', 'bad'); } }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
      return;
    }
    if (k === 'import') { const f = $('#olFile'); if (f) f.click(); return; }
    if (k === 'keyCopy') { const key = window.claude.web.key(); try { await navigator.clipboard.writeText(key); toast('Player code copied.'); } catch (e) { const i = $('#keyIn'); i.value = key; i.select(); toast('Copy the code from the box.'); } return; }
    if (k === 'keyUse') { const v = ($('#keyIn').value || '').trim(); if (!window.claude.web.valid(v)) { toast('That isn’t a player code.', 'bad'); return; } await keepCurrent(); save(); window.claude.web.setKey(v); return; }
  } catch (e) { toast((e && e.message) || 'Something went wrong.', 'bad'); }
  finally { Online.busy = false; }
}
async function importFile(file) {

  if (file.size > 8e6) { toast('That file is too large to be an island.', 'bad'); return; }

    const o = JSON.parse(await file.text()), raw = o && o.driftwood ? o.save : o;
    const T = Sim.deserialize(raw);
    await keepCurrent(); closeSaves(true); swapIsland(T); toast(`Imported ${o && o.name ? '“' + String(o.name).slice(0, 40) + '”' : 'an island'}.`);
  } catch (e) { toast('That isn’t a Driftwood island file.', 'bad'); }
}

const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
